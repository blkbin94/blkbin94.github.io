<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#008c87"/>
<title>하나카드 금융시사 문제은행</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#12191d;--muted:#65727a;--line:#d9e2e5;--brand:#008c87;--brand2:#006b67;--soft:#edf8f7;--good:#137547;--bad:#b32636}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}body{-webkit-text-size-adjust:100%}.app{max-width:940px;margin:0 auto;padding:16px 14px 70px}.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.11)}.hero h1{margin:0 0 8px;font-size:25px;color:#fff}.hero p{margin:0;color:#fff;opacity:.95;line-height:1.55}.countline{margin-top:9px;font-weight:800;color:#fff;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:11px;color:#fff}.stat b{display:block;font-size:20px;color:#fff}.stat span{font-size:11px;color:#fff;opacity:.95}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}button{font:inherit}.nav button,.btn,.choice,.oxbtn,.chip{border-radius:12px;border:1px solid var(--line);cursor:pointer;font-weight:750}.nav button{padding:12px 8px;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink)}.nav button.primary{background:var(--brand);color:#fff;-webkit-text-fill-color:#fff;border-color:var(--brand)}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 4px 14px rgba(0,0,0,.04);color:var(--ink)}.panel *{color:var(--ink)}h2,h3{margin-top:0}.muted{color:var(--muted)!important}.mini{font-size:12.5px;color:var(--muted)!important}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 11px;background:#fff;color:var(--ink);-webkit-text-fill-color:var(--ink);font-size:13px}.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)!important;margin-bottom:10px}.qmeta span{color:var(--muted)!important}.qtext{font-size:20px;line-height:1.6;font-weight:800;margin:8px 0 16px;color:var(--ink)}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;background:#fff;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important;font-size:15px;line-height:1.5}.choice.selected{background:var(--soft);border-color:var(--brand)}.choice.correct{background:#eef9f1;border-color:#85c6a4}.choice.wrong{background:#fff0f2;border-color:#e4a0a9}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{padding:11px 14px;background:#fff;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff!important;-webkit-text-fill-color:#fff!important}.explain{margin-top:16px;padding:15px;background:#f7fafb;border:1px solid var(--line);border-radius:14px;line-height:1.65}.explain .good{color:var(--good)!important}.explain .bad{color:var(--bad)!important}.source{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)!important}.source a{color:var(--brand2)!important;font-weight:700}.hidden{display:none!important}.ox-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.oxbtn{padding:18px 10px;background:#fff;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important;font-size:24px}.oxbtn.o{background:#eef9f1}.oxbtn.x{background:#fff0f2}.progressbar{height:8px;background:#e7edef;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progressbar>div{height:100%;background:var(--brand);width:0}.list-item{padding:12px 0;border-bottom:1px solid var(--line)}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#eef2f3;font-size:11px;margin-right:5px}.notice{background:#fff8e9;border:1px solid #ecd7a6;border-radius:12px;padding:12px;line-height:1.55}footer{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:680px){.app{padding:10px 10px 60px}.hero{border-radius:18px;padding:18px}.hero h1{font-size:21px}.stats{grid-template-columns:repeat(2,1fr)}.nav{grid-template-columns:repeat(2,1fr)}.qtext{font-size:18px}.choice{font-size:15px;padding:13px 12px}.panel{padding:15px;border-radius:16px}}
</style>
</head>
<body>
<div class="app">
<section class="hero"><h1>하나카드 금융시사 문제은행</h1><p>상황형 고난도 객관식과 빠른 OX 회독용 문제은행입니다.</p><div class="countline">객관식 100문제 · OX 100문제 · 총 200문제</div><div class="stats"><div class="stat"><b id="solved">0</b><span>객관식 학습</span></div><div class="stat"><b id="acc">0%</b><span>객관식 정답률</span></div><div class="stat"><b id="oxSolved">0</b><span>OX 학습</span></div><div class="stat"><b id="wrongCnt">0</b><span>오답</span></div></div></section>
<div class="nav"><button class="primary" onclick="startMC('all')">실전 20문제</button><button onclick="startOX()">OX 30문제</button><button onclick="startMC('wrong')">오답만</button><button onclick="showBank()">전체 문제</button></div>
<section id="home" class="panel"><h2>분야 선택</h2><div id="chips" class="chips"></div><div class="notice" style="margin-top:14px"><b>추천 루틴</b><br>OX 30문제 빠른 회독 → 실전 객관식 20문제 → 오답만 반복. 실제 금융시사 파트 20문항에 맞춰 실전 세트를 20문제로 구성했습니다.</div></section>
<section id="mcPanel" class="panel hidden"><div class="qmeta"><span id="mcProg"></span><span id="mcMeta"></span></div><div class="progressbar"><div id="mcBar"></div></div><div id="mcQ" class="qtext"></div><div id="mcChoices"></div><div class="actions"><button id="mcCheck" class="btn primary" onclick="checkMC()">정답 확인</button><button id="favBtn" class="btn" onclick="toggleFav()">☆ 즐겨찾기</button><button id="mcNext" class="btn hidden" onclick="nextMC()">다음 문제</button></div><div id="mcExplain" class="explain hidden"></div></section>
<section id="oxPanel" class="panel hidden"><div class="qmeta"><span id="oxProg"></span><span>OX 스피드</span></div><div class="progressbar"><div id="oxBar"></div></div><div id="oxQ" class="qtext"></div><div class="ox-wrap"><button class="oxbtn o" onclick="answerOX(true)">O</button><button class="oxbtn x" onclick="answerOX(false)">X</button></div><div id="oxExplain" class="explain hidden"></div><div class="actions"><button id="oxNext" class="btn primary hidden" onclick="nextOX()">다음</button></div></section>
<section id="bank" class="panel hidden"><h2>전체 문제</h2><div id="bankList"></div></section>
<section id="result" class="panel hidden"><h2>학습 완료</h2><div id="resultText"></div><div class="actions"><button class="btn primary" onclick="goHome()">홈으로</button><button class="btn" onclick="startMC('wrong')">오답 다시 풀기</button></div></section>
<footer>학습 기록은 Safari/Chrome의 localStorage에 기기별로 저장됩니다.</footer>
</div>
<script src="questions.js?v=3"></script>
<script>
const MC=window.MC_BANK||[];const OX=window.OX_BANK||[];const key="hana_quiz_v3";let st=JSON.parse(localStorage.getItem(key)||'{"mc":{},"wrong":[],"fav":[],"ox":{}}');let active=[],mi=0,sel=null,checked=false,oxActive=[],oi=0,oxAnswered=false;
function save(){localStorage.setItem(key,JSON.stringify(st));stats()}function stats(){const m=Object.values(st.mc),c=m.filter(Boolean).length;document.getElementById("solved").textContent=m.length;document.getElementById("acc").textContent=m.length?Math.round(c/m.length*100)+"%":"0%";document.getElementById("oxSolved").textContent=Object.keys(st.ox).length;document.getElementById("wrongCnt").textContent=st.wrong.length}function hide(){["home","mcPanel","oxPanel","bank","result"].forEach(id=>document.getElementById(id).classList.add("hidden"))}function goHome(){hide();document.getElementById("home").classList.remove("hidden");stats()}function shuf(a){return [...a].sort(()=>Math.random()-.5)}
function cats(){const cs=[...new Set(MC.map(x=>x.cat))];document.getElementById("chips").innerHTML=cs.map(c=>`<button class="chip" onclick="startMC('cat','${c}')">${c} (${MC.filter(x=>x.cat===c).length})</button>`).join("")}
function startMC(mode,cat){let pool=MC;if(mode==="wrong")pool=MC.filter(q=>st.wrong.includes(q.id));if(mode==="cat")pool=MC.filter(q=>q.cat===cat);if(!pool.length){alert("해당 문제 목록이 비어 있습니다.");return}active=shuf(pool).slice(0,Math.min(20,pool.length));mi=0;hide();document.getElementById("mcPanel").classList.remove("hidden");renderMC()}
function renderMC(){const q=active[mi];sel=null;checked=false;document.getElementById("mcProg").textContent=`${mi+1} / ${active.length}`;document.getElementById("mcMeta").textContent=`${q.cat} · 난이도 ${q.diff}`;document.getElementById("mcBar").style.width=(mi/active.length*100)+"%";document.getElementById("mcQ").textContent=q.q;document.getElementById("mcChoices").innerHTML=q.c.map((x,i)=>`<button class="choice" onclick="pick(${i},this)">${["①","②","③","④"][i]} ${x}</button>`).join("");document.getElementById("mcExplain").classList.add("hidden");document.getElementById("mcCheck").classList.remove("hidden");document.getElementById("mcNext").classList.add("hidden");document.getElementById("favBtn").textContent=st.fav.includes(q.id)?"★ 즐겨찾기":"☆ 즐겨찾기"}
function pick(i,el){if(checked)return;sel=i;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
function checkMC(){if(sel===null){alert("보기를 선택해 주세요.");return}const q=active[mi],ok=sel===q.a;checked=true;st.mc[q.id]=ok;if(ok)st.wrong=st.wrong.filter(x=>x!==q.id);else if(!st.wrong.includes(q.id))st.wrong.push(q.id);document.querySelectorAll(".choice").forEach((el,i)=>{el.classList.remove("selected");if(i===q.a)el.classList.add("correct");else if(i===sel&&!ok)el.classList.add("wrong")});document.getElementById("mcExplain").innerHTML=`<h3 class="${ok?'good':'bad'}">${ok?'정답':'오답'} · ${["①","②","③","④"][q.a]}</h3><div>${q.e}</div><div class="source">출처: <a href="${q.u}" target="_blank" rel="noopener">${q.s}</a><br>기준일: ${q.d}</div>`;document.getElementById("mcExplain").classList.remove("hidden");document.getElementById("mcCheck").classList.add("hidden");document.getElementById("mcNext").classList.remove("hidden");save()}
function nextMC(){if(mi<active.length-1){mi++;renderMC()}else finish("객관식 20문제 세트를 완료했습니다.")}function toggleFav(){const id=active[mi].id;st.fav=st.fav.includes(id)?st.fav.filter(x=>x!==id):[...st.fav,id];save();document.getElementById("favBtn").textContent=st.fav.includes(id)?"★ 즐겨찾기":"☆ 즐겨찾기"}
function startOX(){oxActive=shuf(OX).slice(0,Math.min(30,OX.length));oi=0;hide();document.getElementById("oxPanel").classList.remove("hidden");renderOX()}function renderOX(){oxAnswered=false;const q=oxActive[oi];document.getElementById("oxProg").textContent=`${oi+1} / ${oxActive.length}`;document.getElementById("oxBar").style.width=(oi/oxActive.length*100)+"%";document.getElementById("oxQ").textContent=q.q;document.getElementById("oxExplain").classList.add("hidden");document.getElementById("oxNext").classList.add("hidden");document.querySelectorAll(".oxbtn").forEach(b=>b.disabled=false)}function answerOX(ans){if(oxAnswered)return;oxAnswered=true;const q=oxActive[oi],ok=ans===q.a;st.ox[q.id]=ok;document.querySelectorAll(".oxbtn").forEach(b=>b.disabled=true);document.getElementById("oxExplain").innerHTML=`<h3 class="${ok?'good':'bad'}">${ok?'정답':'오답'} · 정답 ${q.a?'O':'X'}</h3><div>${q.e}</div><div class="source">출처: <a href="${q.u}" target="_blank" rel="noopener">${q.s}</a><br>기준일: ${q.d}</div>`;document.getElementById("oxExplain").classList.remove("hidden");document.getElementById("oxNext").classList.remove("hidden");save()}function nextOX(){if(oi<oxActive.length-1){oi++;renderOX()}else finish("OX 30문제 회독을 완료했습니다.")}
function finish(msg){hide();document.getElementById("result").classList.remove("hidden");document.getElementById("resultText").innerHTML=`<p><b>${msg}</b></p><p class="muted">오답은 '오답만' 메뉴에서 반복할 수 있습니다.</p>`}
function showBank(){hide();document.getElementById("bank").classList.remove("hidden");const m=MC.map(q=>`<div class="list-item"><span class="badge">${q.cat}</span><span class="badge">난이도 ${q.diff}</span><b style="display:block;margin-top:7px">Q${q.id}. ${q.q}</b><div class="mini">${st.mc[q.id]===true?'정답 기록':st.mc[q.id]===false?'오답 기록':'미학습'}</div></div>`).join("");const o=OX.map(q=>`<div class="list-item"><span class="badge">OX</span><b style="display:block;margin-top:7px">${q.q}</b><div class="mini">${st.ox[q.id]===true?'정답 기록':st.ox[q.id]===false?'오답 기록':'미학습'}</div></div>`).join("");document.getElementById("bankList").innerHTML=`<h3>객관식 ${MC.length}문제</h3>`+m+`<h3 style="margin-top:20px">OX ${OX.length}문제</h3>`+o}
if(!MC.length||!OX.length){document.body.innerHTML='<div style="padding:40px;font-family:sans-serif">문제 데이터를 불러오지 못했습니다. 새로고침해 주세요.</div>'}else{cats();stats();goHome()}
</script>
</body></html>
